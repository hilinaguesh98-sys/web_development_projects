<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Contact — Habesha Eatery, Bole</title>
      <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa.">  
    </head>
    <body>
        <header><h1>Contact Habesha Eatery</h1></header>
         <nav><a href="index.html">Reservations</a> | 
             <a href="contact.html">Contact</a></nav><br><br>
         <main>
            <form action="/contact" method="post">
                 <label for="name">Name</label>
                 <input type="text" id="name" name="name" required><br><br>
                 <label for="email">Email</label>
                 <input type="email" id="email" name="email" required><br><br>
                 <label for="message">Message</label>
                 <textarea id="message" name="message" required></textarea><br><br>
                 <button type="submit">Send Message</button>

            </form><br><br><br>
            <table>
                <caption>Opening Hours</caption>
                <thead><tr><th scope="col">Day</th>
                    <th scope="col">Hours</th></tr>
                </thead>
                <tr><td>Monday</td>
                    <td>8:00 AM – 9:00 PM</td></tr>
                <tr><td>Tuesday</td>
                    <td>8:00 AM – 9:00 PM</td></tr>
                <tr><td>Wednesday</td>
                    <td>8:00 AM – 9:00 PM</td></tr>
                <tr><td>Thursday</td>
                    <td>8:00 AM – 9:00 PM</td></tr>
                <tr><td>Friday</td>
                <td>8:00 AM – 10:00 PM</td></tr>
                <tr><td>Saturday</td>
                    <td>9:00 AM – 10:00 PM</td></tr>
                <tr><td>Sunday</td>
                    <td>9:00 AM – 8:00 PM</td></tr>
                </tbody>
                
</table>
            </main><br><br><br>
            <footer>Bole, Addis Ababa</footer>
    </body>
</html>
