<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width",initial-scale=1.0">
    <meta name="description" content="Register for Ethio Telecom services online by providing your personal information through this registration form">
    <title>Ethio Telecom Registration</title>
</head>
<body>
    <h1>Ethio Telecom Service Registration</h1><br><br>
    <from action="/register" method="post">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required><br><br><br>
        <label for="email">Email Adress</label>
        <input type="text" id="email" name="email"
        placeholder="hilinaguesh@gmail.com" required><br><br><br>
         <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" 
        pattern="^\+251\d{9}"
        placeholder="+251953158497" required><br><br><br>

        <label for="branch">Branch</label>
        <select id="branch" name="branch" required>
            <option value="">Select Branch</option>
            <option value="bole">Bole</option>
            <option value="kasanchis">Kasanchis</option>
            <option value="piassa">Piassa</option>

        </select>
    </from><br><br><br><br>

<!--2-->

    <table border="1">
        <caption><h2>Airlines flight table</h2> </caption>
        <thead>
            
            <tr><th scope="col">Flight</th>
            <th scope="col">From</th>
            <th scope="col">To</th>
            <th scope="col">Departs</th>
            <th scope="col">Price ETB</th>
            </tr>
        </thead>
        <tbody>
            <tr><th scope="col">ET101</th>
            <th scope="col">Addis Ababa</th>
            <th scope="col">Hawasa</th>
            <th scope="col">2:30 PM</th>
            <th scope="col">5000</th></tr>

            <tr><th scope="col">ET260</th>
            <th scope="col">Addis Ababa</th>
            <th scope="col">Mekelle</th>
            <th scope="col">5:20 PM</th>
            <th scope="col">10,000</th></tr>

            <tr><th scope="col">ET303</th>
            <th scope="col">Addis Ababa</th>
            <th scope="col">Dire Dawa</th>
            <th scope="col">7:30 AM</th>
            <th scope="col">8000</th></tr>

            <tr><th scope="col">ET400</th>
            <th scope="col">Addis Ababa</th>
            <th scope="col">Gonder</th>
            <th scope="col">9:00 AM</th>
            <th scope="col">8300</th></tr>
        </tbody>

    </table><br><br><br>
<!--3-->
<section> <h2>Axum</h2>

    <figure>
<img src="Assets/axum.png"
 alt="The ancient obelisk of Axum"
 width="500">
<figcaption>The obelisk of Axum is one of the most famous
     historical landmarks in Ethiopia</figcaption>
</figure>
<iframe src="https://www.google.com/maps?q=Axum,Ethiopia&output=embed"
width="600"
height="450"
style="border:0;"
allowfullscreen
loading="lazy"
title="Location of Axum,Ethiopia">
</iframe>
</section><br><br><br>
<div>submit</div><br>
<button type="button">submit</button><br><br>
<!--changed the <div> to <button> so that people can use tab key to reach it and press enter
    or space to use it -->
<input type="text"><br>
 <label for="email">Email Address</label>
<input type="email" id="email" name="email"><br><br>
<!--added label for the input so that screen readers can tell what to type-->
<img src="axum.png"><br>
<img src="axum.png"
 alt="The ancient obelisk of Axum">
<!--added meaningfull alt to the image so that screen readers can read the description 
to users who can't see the image -->

</body>
</html>
