<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RentSpace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
      <nav class="navbar">
        <a href="index.html" class="logo">
          <img src="proporty-image/logo.jpg" alt="RentSpace logo">
        </a>
        <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-navigation">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" id="site-navigation">
          <li><a href="index.html">Home</a></li>
         </ul>
      </nav> 
    </header>

  <main class="container" style="max-width:450px; margin-top:4rem;">
    <div style="background-color:var(--card-bg); padding:2rem; border-radius:8px; border:1px solid var(--border-color);">
      <h2>User Login</h2>
      <form id="login-form" style="display:flex; flex-direction:column; gap:1rem; margin-top:1.5rem;">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="role">
            <option value="renter">Renter</option>
            <option value="landlord">Landlord</option>
          </select>
        </div>
        <button type="submit" class="btn" style="background-color: #0b2f5c; color: #ffffff; padding: 12px 28px; font-size: 1rem; font-weight: 600; border: none; border-radius: 6px; cursor: pointer;">Login</button>
      </form>
      <p style="margin-top:1rem; font-size:0.875rem;">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </main>
    <footer class="site-footer">
    <img src="proporty-image/logo2.jpg" alt="RentSpace Logo" class="footer-logo">
  <p class="footer-text">&copy; 2026 RentSpace. All rights reserved.</p>
    </footer>
  <script src="storage.js"></script>
  <script src="nav.js"></script>
  <script src="auth.js"></script>
</body>
</html>
