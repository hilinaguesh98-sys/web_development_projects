<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - RentSpace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container" style="max-width:400px; margin-top:6rem;">
    <div style="background-color:var(--card-bg); padding:2rem; border-radius:8px; border:1px solid var(--border-color);">
      <h2>Admin Portal</h2>
      <form id="admin-login-form" style="display:flex; flex-direction:column; gap:1rem; margin-top:1.5rem;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn" style="background-color: #0b2f5c; color: #ffffff; padding: 12px 28px; font-size: 1rem; font-weight: 600; border: none; border-radius: 6px; cursor: pointer;">Login to Dashboard</button>
      </form>
    </div>
  </main>

  <script src="storage.js"></script>
  <script src="admin.js"></script>
</body>
</html>
